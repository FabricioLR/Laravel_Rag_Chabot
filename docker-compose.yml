services:
  app:
    build:
      context: .
      target: dev
      dockerfile: docker/Dockerfile
    container_name: laravel_app_dev
    command: sh -c "php artisan key:generate && php artisan migrate --seed && php artisan serve --host=0.0.0.0 --port=8000"
    ports:
      - "8000:8000"
      - "5173:5173"
    volumes:
      - .:/var/www
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dev

  db:
    image: pgvector/pgvector:pg15
    container_name: laravel_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-dev}
      POSTGRES_USER: ${DB_USERNAME:-dev}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-dev}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - dev

  redis:
    image: redis:7.4-alpine
    container_name: laravel_redis_dev
    restart: unless-stopped
    command: redis-server --requirepass dev --save 60 1
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "dev", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - dev

networks:
  dev:
    driver: bridge

volumes:
  pg_data:
  redis_data: